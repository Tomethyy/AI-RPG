<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI-RPG">
<meta name="theme-color" content="#14110f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>AI-RPG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <span class="title" id="location">The Rusted Ford</span>
    <span class="stats"><span id="hp">HP 18/20</span> · <span id="turn">Turn 1</span></span>
  </header>
  <div class="hpbar" id="hpbar" role="progressbar" aria-label="HP" aria-valuemin="0"><div id="hpfill"></div></div>

  <main class="story" id="story" aria-live="polite"></main>

  <footer class="actions">
    <div class="options" id="options"></div>
    <div class="generic" id="generic"></div>
    <form class="custom" id="custom" hidden>
      <input id="customText" type="text" placeholder="I try to…" autocomplete="off" enterkeyhint="send">
      <button type="submit">Go</button>
      <button type="button" id="customCancel" class="ghost">Cancel</button>
    </form>
  </footer>

  <div class="backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="More actions" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
